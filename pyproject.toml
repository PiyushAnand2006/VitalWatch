[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vitalwatch-part2"
version = "0.1.0"
description = "Privacy-first document RAG and verified explanation backend for VitalWatch Part 2"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14.0",
    "fastapi>=0.115.0",
    "huggingface-hub>=0.20",
    "pgvector>=0.3.0",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "PyMuPDF>=1.26.0",
    "pytesseract>=0.3.13",
    "Pillow>=11.0.0",
    "python-docx>=1.1.0",
    "python-multipart>=0.0.20",
    "sentence-transformers>=3.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "uvicorn>=0.34.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.0",
    "mypy>=1.14.0",
    "pgserver>=0.1.4",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.9.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
minversion = "8.3"
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers --basetemp=.pytest_tmp"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs an embedded PostgreSQL server, the local embedding model, or both",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["app"]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "fitz",
    "pytesseract",
    "numpy",
    "huggingface_hub",
    "sentence_transformers",
    "torch",
]
follow_imports = "skip"
ignore_missing_imports = true
